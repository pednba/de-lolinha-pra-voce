<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<style>
  :root {
    --rosa: #ad1457; --rosa-claro: #fce4ec; --verde: #2e7d32; --verde-claro: #e8f5e9;
    --texto: #1c1b1f; --suave: #5f5f66; --borda: #dcdce0; --fundo: #f7f7f8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         font-size: 18px; line-height: 1.4; color: var(--texto); background: var(--fundo); }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px 80px; }
  h1 { font-size: 24px; margin: 8px 0 16px; }
  .cartao { background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .total { font-size: 34px; font-weight: 700; color: var(--rosa); }
  .dica { font-size: 15px; color: var(--suave); margin-top: 6px; }
  .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  button { font: inherit; border: 0; border-radius: 14px; min-height: 56px; padding: 12px 16px; cursor: pointer; }
  button:disabled { opacity: .6; }
  .primario { background: var(--rosa); color: #fff; font-weight: 700; }
  .secundario { background: var(--verde); color: #fff; font-weight: 700; }
  .leve { background: #ececef; color: var(--texto); }
  .largo { width: 100%; margin-top: 12px; }
  .link { background: none; color: var(--rosa); min-height: 44px; padding: 8px 0; text-decoration: underline; }
  .voltar { background: none; color: var(--rosa); min-height: 44px; padding: 0; font-weight: 600; }
  label { display: block; font-weight: 600; margin: 18px 0 6px; }
  input { width: 100%; font: inherit; font-size: 20px; padding: 14px; border: 2px solid var(--borda);
          border-radius: 12px; background: #fff; color: var(--texto); }
  input:focus { outline: none; border-color: var(--rosa); }
  .check { display: flex; align-items: center; gap: 12px; }
  .check input { width: 28px; height: 28px; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { background: #fff; border: 2px solid var(--borda); min-height: 50px; }
  .chip[aria-pressed="true"] { border-color: var(--rosa); background: var(--rosa-claro); font-weight: 700; }
  .cliente { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%;
             background: #fff; border: 1px solid var(--borda); border-radius: 14px; padding: 14px 16px;
             margin-bottom: 8px; text-align: left; }
  .cliente small { display: block; font-size: 14px; font-weight: 400; text-align: right; }
  .deve { color: var(--rosa); font-weight: 700; }
  .credito { color: var(--verde); font-weight: 700; }
  .quitado { color: var(--suave); }
  .erro { background: #ffebee; color: #b71c1c; border-radius: 12px; padding: 12px; margin: 12px 0; }
  .sucesso { background: var(--verde-claro); border-radius: 16px; padding: 20px; margin-bottom: 12px; }
  .sucesso strong { font-size: 24px; display: block; margin-bottom: 8px; }
  .item { border-bottom: 1px solid var(--borda); padding: 12px 0; }
  .item:last-child { border-bottom: 0; }
  .item-topo { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
  .item.cancelado { opacity: .5; }
  .item.cancelado .item-topo { text-decoration: line-through; }
  .carregando { position: fixed; inset: 0; background: rgba(255, 255, 255, .85); display: grid;
                place-items: center; font-size: 20px; z-index: 10; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="carregando" class="carregando" hidden>Um instante…</div>
<main>

  <section id="tela-pin" hidden>
    <h1>Vendinhas da Loly</h1>
    <div class="cartao">
      <label for="pin" id="rotulo-pin">Digite seu PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12"
             onkeydown="if (event.key === 'Enter') entrarComPin()">
      <div id="erro-pin" class="erro" hidden></div>
      <button id="btn-pin" class="primario largo" onclick="entrarComPin()">Entrar</button>
    </div>
  </section>

  <section id="tela-inicio" hidden>
    <h1>Vendinhas da Loly</h1>
    <div class="cartao">
      <div class="dica">Total a receber</div>
      <div id="total-receber" class="total">R$ 0,00</div>
      <div id="resumo-linha" class="dica"></div>
    </div>
    <div class="botoes">
      <button class="primario" onclick="abrirForm('venda')">Vendi</button>
      <button class="secundario" onclick="abrirForm('pagamento')">Recebi</button>
    </div>
    <input id="busca" type="search" placeholder="Procurar cliente" autocomplete="off" oninput="renderClientes()">
    <div id="lista-clientes" style="margin-top:12px"></div>
    <button id="btn-quitados" class="link" onclick="alternarQuitados()">Mostrar quem já quitou</button>
    <div id="erro-inicio" class="erro" hidden></div>
  </section>

  <section id="tela-form" hidden>
    <button class="voltar" onclick="irInicio()">← Voltar</button>
    <h1 id="titulo-form">Anotar venda</h1>

    <label for="f-cliente">Cliente</label>
    <input id="f-cliente" list="lista-nomes" autocomplete="off" oninput="dicaCliente()">
    <datalist id="lista-nomes"></datalist>
    <div id="dica-cliente" class="dica"></div>

    <label for="f-valor">Valor</label>
    <input id="f-valor" inputmode="decimal" autocomplete="off" placeholder="0,00" oninput="dicaValor()">
    <div id="dica-valor" class="dica"></div>

    <div id="bloco-venda">
      <label for="f-descricao">O que vendeu</label>
      <input id="f-descricao" autocomplete="off" placeholder="ex.: 2 sutiãs">
      <label class="check"><input id="f-pago" type="checkbox" onchange="atualizarMeio()"> Já pagou na hora</label>
    </div>

    <div id="bloco-meio" hidden>
      <label>Como pagou</label>
      <div class="chips" id="chips-meio">
        <button type="button" class="chip" data-meio="dinheiro" aria-pressed="false">Dinheiro</button>
        <button type="button" class="chip" data-meio="pix" aria-pressed="false">Pix</button>
        <button type="button" class="chip" data-meio="infinitepay" aria-pressed="false">InfinitePay</button>
        <button type="button" class="chip" data-meio="outro" aria-pressed="false">Outro</button>
      </div>
    </div>

    <label for="f-data">Data</label>
    <input id="f-data" type="date">

    <label for="f-obs">Observação (opcional)</label>
    <input id="f-obs" autocomplete="off">

    <div id="erro-form" class="erro" hidden></div>
    <button id="btn-salvar" class="primario largo" onclick="salvar()">Anotar</button>
  </section>

  <section id="tela-ok" hidden>
    <div class="sucesso">
      <strong>Anotado!</strong>
      <div id="ok-linha"></div>
      <div id="ok-saldo" style="margin-top:8px;font-weight:700"></div>
      <div id="ok-novo" class="dica" hidden>Cliente nova adicionada.</div>
    </div>
    <button class="primario largo" onclick="abrirForm(tipoForm)">Anotar outra</button>
    <button id="btn-ok-extrato" class="leve largo" onclick="abrirExtrato(ultimo.cliente)">Ver a conta</button>
    <button class="leve largo" onclick="irInicio()">Início</button>
    <button id="btn-desfazer" class="link" onclick="desfazer(this)">Desfazer</button>
    <div id="erro-ok" class="erro" hidden></div>
  </section>

  <section id="tela-extrato" hidden>
    <button class="voltar" onclick="irInicio()">← Voltar</button>
    <h1 id="ext-nome"></h1>
    <div class="cartao">
      <div id="ext-saldo" style="font-size:24px"></div>
    </div>
    <div class="botoes">
      <button class="primario" onclick="abrirForm('venda', extratoAtual.cliente)">Vendi</button>
      <button class="secundario" onclick="abrirForm('pagamento', extratoAtual.cliente)">Recebi</button>
    </div>
    <div class="cartao" id="ext-itens"></div>
    <div id="erro-extrato" class="erro" hidden></div>
  </section>

</main>
<script>
  var CHAVE_TOKEN = 'vendinhas_loly_token';
  var ROTULO_MEIO = { dinheiro: 'Dinheiro', pix: 'Pix', infinitepay: 'InfinitePay', outro: 'Outro' };
  var TELAS = ['tela-pin', 'tela-inicio', 'tela-form', 'tela-ok', 'tela-extrato'];

  var estado = null;
  var extratoAtual = null;
  var ultimo = null;
  var tipoForm = 'venda';
  var meioEscolhido = '';
  var envioAtual = '';
  var mostrarQuitados = false;
  var tokenMemoria = '';
  var criandoPin = false;

  function $(id) { return document.getElementById(id); }

  // --- token: guardado no aparelho para ela não digitar o PIN toda vez ---
  function lerToken() {
    try { return localStorage.getItem(CHAVE_TOKEN) || tokenMemoria; } catch (e) { return tokenMemoria; }
  }
  function salvarToken(t) {
    tokenMemoria = t;
    try { if (t) localStorage.setItem(CHAVE_TOKEN, t); else localStorage.removeItem(CHAVE_TOKEN); } catch (e) {}
  }

  // --- utilidades ---
  function brl(v) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(v); }
  function dataBR(iso) { return String(iso).split('-').reverse().join('/'); }
  function chaveNome(n) {
    return String(n || '').trim().replace(/\s+/g, ' ').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }
  // Mesma regra do servidor (Logica.gs), usada só para mostrar a prévia do valor.
  function parseValor(entrada) {
    var bruto = String(entrada || '');
    if (bruto.indexOf('-') >= 0) return NaN;
    var s = bruto.replace(/[^\d.,]/g, '');
    if (!s) return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    var n = Number(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : NaN;
  }
  function novoId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
  }
  function el(tag, classe, texto) {
    var e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto != null) e.textContent = texto;
    return e;
  }
  function mostrar(id) {
    TELAS.forEach(function (t) { $(t).hidden = t !== id; });
    window.scrollTo(0, 0);
  }
  function erro(id, msg) { $(id).textContent = msg || ''; $(id).hidden = !msg; }
  function carregando(sim) { $('carregando').hidden = !sim; }

  // Botão que pede um segundo toque antes de uma ação destrutiva.
  function confirmarDuplo(botao, textoConfirma, acao) {
    if (botao.dataset.armado === '1') { botao.dataset.armado = ''; acao(); return; }
    var original = botao.textContent;
    botao.dataset.armado = '1';
    botao.textContent = textoConfirma;
    setTimeout(function () { botao.dataset.armado = ''; botao.textContent = original; }, 4000);
  }

  function saldoTexto(nome, saldo) {
    if (saldo > 0) return nome + ' deve ' + brl(saldo);
    if (saldo < 0) return nome + ' tem crédito de ' + brl(-saldo);
    return nome + ' está quitada';
  }

  // --- chamada ao servidor ---
  function chamar(nome) {
    var args = Array.prototype.slice.call(arguments, 1);
    carregando(true);
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (r) { carregando(false); resolve(r); })
        .withFailureHandler(function (e) {
          carregando(false);
          var msg = String((e && e.message) || e).replace(/^(Exception|Error):\s*/, '');
          if (msg.indexOf('ACESSO_EXPIRADO') >= 0) {
            salvarToken('');
            mostrar('tela-pin');
            msg = 'Digite o PIN de novo.';
            erro('erro-pin', msg);
          }
          reject(new Error(msg));
        });
      runner[nome].apply(runner, args);
    });
  }

  // --- PIN ---
  // Na primeira vez que o app abre ainda não existe PIN: a tela vira "crie o seu".
  function prepararPin() {
    chamar('precisaDefinirPin').then(function (precisa) {
      criandoPin = precisa;
      $('rotulo-pin').textContent = precisa ? 'Escolha um PIN de 4 a 8 números' : 'Digite seu PIN';
      $('btn-pin').textContent = precisa ? 'Criar PIN' : 'Entrar';
      mostrar('tela-pin');
    }).catch(function (e) { mostrar('tela-pin'); erro('erro-pin', e.message); });
  }

  function entrarComPin() {
    erro('erro-pin', '');
    chamar(criandoPin ? 'definirPin' : 'entrar', $('pin').value).then(function (token) {
      salvarToken(token);
      $('pin').value = '';
      carregarInicio();
    }).catch(function (e) { erro('erro-pin', e.message); });
  }

  // --- início ---
  function carregarInicio() {
    chamar('estado', lerToken()).then(function (r) {
      estado = r;
      renderInicio();
      mostrar('tela-inicio');
    }).catch(function (e) { if ($('tela-pin').hidden) { mostrar('tela-inicio'); erro('erro-inicio', e.message); } });
  }
  function irInicio() {
    if (estado) { renderInicio(); mostrar('tela-inicio'); }
    carregarInicio();
  }
  function renderInicio() {
    erro('erro-inicio', '');
    var r = estado.resumo;
    $('total-receber').textContent = brl(r.totalReceber);
    var partes = [r.clientesDevendo === 1 ? '1 cliente devendo' : r.clientesDevendo + ' clientes devendo'];
    if (r.totalCredito > 0) partes.push(brl(r.totalCredito) + ' em crédito de clientes');
    $('resumo-linha').textContent = partes.join(' · ');
    renderClientes();
  }
  function alternarQuitados() {
    mostrarQuitados = !mostrarQuitados;
    $('btn-quitados').textContent = mostrarQuitados ? 'Esconder quem já quitou' : 'Mostrar quem já quitou';
    renderClientes();
  }
  function renderClientes() {
    var lista = $('lista-clientes');
    lista.innerHTML = '';
    if (!estado) return;
    var busca = chaveNome($('busca').value);
    var visiveis = estado.saldos.filter(function (s) {
      if (busca) return chaveNome(s.cliente).indexOf(busca) >= 0;
      return mostrarQuitados || Math.round(s.saldo * 100) !== 0;
    });
    if (!visiveis.length) {
      lista.appendChild(el('div', 'dica', busca ? 'Nenhuma cliente com esse nome.' : 'Ninguém devendo. Toque em "Vendi" para anotar.'));
      return;
    }
    visiveis.forEach(function (s) {
      var linha = el('button', 'cliente');
      linha.appendChild(el('span', '', s.cliente));
      var lado = el('span', s.saldo > 0 ? 'deve' : s.saldo < 0 ? 'credito' : 'quitado', brl(Math.abs(s.saldo)));
      lado.appendChild(el('small', '', s.saldo > 0 ? 'deve' : s.saldo < 0 ? 'crédito' : 'quitada'));
      linha.appendChild(lado);
      linha.onclick = function () { abrirExtrato(s.cliente); };
      lista.appendChild(linha);
    });
  }

  // --- formulário ---
  function abrirForm(tipo, clientePre) {
    tipoForm = tipo;
    envioAtual = novoId();
    meioEscolhido = '';
    $('titulo-form').textContent = tipo === 'venda' ? 'Anotar venda' : 'Anotar pagamento';
    $('bloco-venda').hidden = tipo !== 'venda';
    $('f-cliente').value = clientePre || '';
    $('f-valor').value = '';
    $('f-descricao').value = '';
    $('f-pago').checked = false;
    $('f-obs').value = '';
    $('f-data').value = estado ? estado.hoje : '';
    $('btn-salvar').disabled = false;
    $('btn-salvar').textContent = 'Anotar';
    document.querySelectorAll('#chips-meio .chip').forEach(function (c) { c.setAttribute('aria-pressed', 'false'); });

    var datalist = $('lista-nomes');
    datalist.innerHTML = '';
    (estado ? estado.clientes : []).forEach(function (n) { var o = el('option'); o.value = n; datalist.appendChild(o); });

    erro('erro-form', '');
    atualizarMeio();
    dicaCliente();
    dicaValor();
    mostrar('tela-form');
    (clientePre ? $('f-valor') : $('f-cliente')).focus();
  }
  function atualizarMeio() {
    $('bloco-meio').hidden = !(tipoForm === 'pagamento' || $('f-pago').checked);
  }
  function dicaCliente() {
    var nome = $('f-cliente').value;
    var existe = estado && estado.clientes.some(function (n) { return chaveNome(n) === chaveNome(nome); });
    $('dica-cliente').textContent = nome.trim() && !existe ? 'Cliente nova. Confira o nome antes de anotar.' : '';
  }
  function dicaValor() {
    var bruto = $('f-valor').value;
    var v = parseValor(bruto);
    $('dica-valor').textContent = !bruto.trim() ? '' : v > 0 ? '= ' + brl(v) : 'Valor não entendido';
  }
  $('chips-meio').addEventListener('click', function (ev) {
    var chip = ev.target.closest('.chip');
    if (!chip) return;
    meioEscolhido = chip.dataset.meio;
    document.querySelectorAll('#chips-meio .chip').forEach(function (c) {
      c.setAttribute('aria-pressed', c === chip ? 'true' : 'false');
    });
  });

  function salvar() {
    var botao = $('btn-salvar');
    if (botao.disabled) return;
    botao.disabled = true;
    botao.textContent = 'Anotando…';
    erro('erro-form', '');
    var dados = {
      envioId: envioAtual,
      tipo: tipoForm,
      cliente: $('f-cliente').value,
      valor: $('f-valor').value,
      descricao: tipoForm === 'venda' ? $('f-descricao').value : '',
      pagoNaHora: tipoForm === 'venda' && $('f-pago').checked,
      meio: meioEscolhido,
      data: $('f-data').value,
      obs: $('f-obs').value
    };
    chamar('registrar', lerToken(), dados).then(function (r) {
      ultimo = r;
      estado = r.estado;
      renderOk(r);
      mostrar('tela-ok');
    }).catch(function (e) {
      // O mesmo envioId é reenviado na nova tentativa, então não duplica.
      botao.disabled = false;
      botao.textContent = 'Anotar';
      erro('erro-form', e.message);
    });
  }

  // --- confirmação ---
  function renderOk(r) {
    var venda = r.lancamentos[0];
    var texto = (venda.tipo === 'venda' ? 'Venda para ' : 'Pagamento de ') + r.cliente + ': ' + brl(venda.valor);
    if (venda.descricao) texto += ' (' + venda.descricao + ')';
    if (venda.tipo === 'pagamento' && venda.meio) texto += ' em ' + ROTULO_MEIO[venda.meio];
    if (r.lancamentos[1]) texto += '. Pago na hora em ' + ROTULO_MEIO[r.lancamentos[1].meio] + '.';
    $('ok-linha').textContent = texto;
    $('ok-saldo').textContent = saldoTexto(r.cliente, r.saldo) + '.';
    $('ok-novo').hidden = !r.clienteNovo;
    var desfazerBtn = $('btn-desfazer');
    desfazerBtn.hidden = false;
    desfazerBtn.textContent = 'Desfazer';
    erro('erro-ok', '');
  }
  function desfazer(botao) {
    confirmarDuplo(botao, 'Toque de novo para desfazer', function () {
      chamar('cancelar', lerToken(), ultimo.ids).then(function (r) {
        estado = r.estado;
        botao.hidden = true;
        $('ok-linha').textContent = 'Lançamento desfeito.';
        $('ok-saldo').textContent = saldoTexto(r.cliente, r.extrato.saldo) + '.';
        $('ok-novo').hidden = true;
      }).catch(function (e) { erro('erro-ok', e.message); });
    });
  }

  // --- conta da cliente ---
  function abrirExtrato(cliente) {
    chamar('extratoCliente', lerToken(), cliente).then(function (x) {
      renderExtrato(x);
      mostrar('tela-extrato');
    }).catch(function (e) { erro('erro-inicio', e.message); });
  }
  function renderExtrato(x) {
    extratoAtual = x;
    erro('erro-extrato', '');
    $('ext-nome').textContent = x.cliente;
    var saldo = $('ext-saldo');
    saldo.textContent = saldoTexto(x.cliente, x.saldo);
    saldo.className = x.saldo > 0 ? 'deve' : x.saldo < 0 ? 'credito' : 'quitado';

    var caixa = $('ext-itens');
    caixa.innerHTML = '';
    if (!x.itens.length) { caixa.appendChild(el('div', 'dica', 'Nada anotado ainda.')); return; }
    x.itens.forEach(function (i) {
      var item = el('div', 'item' + (i.cancelado ? ' cancelado' : ''));
      var topo = el('div', 'item-topo');
      var rotulo = i.tipo === 'venda' ? 'Venda' : 'Pagamento' + (i.meio ? ' · ' + ROTULO_MEIO[i.meio] : '');
      topo.appendChild(el('span', '', dataBR(i.data) + ' · ' + rotulo));
      topo.appendChild(el('span', i.tipo === 'venda' ? 'deve' : 'credito', (i.tipo === 'venda' ? '+ ' : '− ') + brl(i.valor)));
      item.appendChild(topo);
      var detalhe = [i.descricao, i.obs].filter(Boolean).join(' · ');
      if (detalhe) item.appendChild(el('div', 'dica', detalhe));
      if (i.cancelado) {
        item.appendChild(el('div', 'dica', 'apagado'));
      } else {
        item.appendChild(el('div', 'dica', 'saldo depois: ' + brl(i.saldoApos)));
        var apagar = el('button', 'link', 'Apagar');
        apagar.onclick = function () {
          confirmarDuplo(apagar, 'Toque de novo para apagar', function () {
            chamar('cancelar', lerToken(), [i.id]).then(function (r) {
              estado = r.estado;
              renderExtrato(r.extrato);
            }).catch(function (e) { erro('erro-extrato', e.message); });
          });
        };
        item.appendChild(apagar);
      }
      caixa.appendChild(item);
    });
  }

  // --- partida ---
  if (lerToken()) carregarInicio(); else prepararPin();
</script>
</body>
</html>
